{% extends 'main/base.html' %}

{% block content %}

<h1 class="index-title">آخر المنشورات</h1>

{% for post in posts %}
    <div class="post-box">

        <!-- الصورة (تظهر فقط إذا موجودة) -->
        {% if post.image %}
            <img src="{{ post.image.url }}" alt="{{ post.title }}" class="post-image">
        {% endif %}

        <!-- العنوان مع رابط التفاصيل -->
        <h3 class="post-title">
            <a href="{% url 'main:post_detail_view' post.id %}" class="post-link">
                {{ post.title }}
            </a>
        </h3>

        <p class="post-content">{{ post.content|truncatewords:20 }}</p>

        <small class="post-date">نُشر في: {{ post.published_at }}</small>

        <!-- زر التفاصيل -->
        <div class="details-container">
            <a href="{% url 'main:post_detail_view' post.id %}" class="details-btn">
                عرض التفاصيل
            </a>
        </div>

    </div>
{% empty %}
    <p class="no-posts">لا يوجد منشورات حالياً.</p>
{% endfor %}

{% endblock %}
